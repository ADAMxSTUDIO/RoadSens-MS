<form class="login-form" (ngSubmit)="login()" #loginForm="ngForm">
  <h2>Login</h2>

  <div class="form-group">
    <label for="email">Email</label><br />
    <input
      id="email"
      name="email"
      type="email"
      required
      [(ngModel)]="form.email"
    />
  </div>

  <div class="form-group">
    <label for="password">Password</label><br />
    <input
      id="password"
      name="password"
      type="password"
      required
      [(ngModel)]="form.password"
    />
  </div>

  <button type="submit" [disabled]="loginForm.invalid || isSubmitting">
    Login
  </button>

  <p *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </p>
</form>

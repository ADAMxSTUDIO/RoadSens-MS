spring:
  application:
    name: SERVICE-INGESTIONVIDEO
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PWD}
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${HMAC_SECRET}
    expiration-ms: 3600000 # 1 hour

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8080/eureka/

logging:
  level:
    ma.emsi.ingestionvideo: DEBUG